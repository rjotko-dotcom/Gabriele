<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(fonts/montl-400.woff2);font-weight:400}
@font-face{font-family:M;src:url(fonts/montl-500.woff2);font-weight:500}
@font-face{font-family:M;src:url(fonts/montl-600.woff2);font-weight:600}
@font-face{font-family:M;src:url(fonts/montl-700.woff2);font-weight:700}
@font-face{font-family:M;src:url(fonts/montl-800.woff2);font-weight:800}
@font-face{font-family:M;src:url(fonts/mont-500.woff2);font-weight:500;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-700.woff2);font-weight:700;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-800.woff2);font-weight:800;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-600.woff2);font-weight:600;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-400.woff2);font-weight:400;unicode-range:U+0100-024F}
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}
*{box-sizing:border-box}
#stage{position:absolute;inset:0;overflow:hidden;font-family:M,sans-serif;color:#fff;background:#000}
.abs{position:absolute}.layer{position:absolute;inset:0;overflow:hidden}
.wall{position:absolute;inset:-60px;background:url(bgplate.png) center/cover;filter:blur(48px) brightness(.3)}
.wallgrad{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 55%,transparent 0,rgba(0,0,0,.55) 70%,#000 100%),linear-gradient(180deg,#000 0,rgba(0,0,0,.15) 30%,rgba(0,0,0,.1) 60%,#000 100%)}
.beam{position:absolute;width:560px;height:3200px;left:0;top:-700px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10) 30%,rgba(255,255,255,.17) 50%,rgba(255,255,255,.10) 70%,transparent);filter:blur(30px);mix-blend-mode:screen}
.carwrap{position:absolute;left:0;top:0;width:1122px;height:590px;transform-origin:0 0}
.carwrap img{position:absolute;left:0;top:0;width:1122px;height:590px}
.feather{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 80%,transparent 100%),linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
.sweep{position:absolute;inset:0;-webkit-mask-image:url(lumcar.png);-webkit-mask-size:100% 100%}
.sweep i{position:absolute;top:-50%;height:200%;width:260px;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-22deg)}
.flare{position:absolute;width:0;height:0}
.flare b{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(220,235,255,.6) 12%,rgba(180,210,255,.15) 40%,transparent 70%)}
.flare s{position:absolute;left:-420px;top:-3px;width:840px;height:6px;background:linear-gradient(90deg,transparent,rgba(200,225,255,.85),transparent);filter:blur(1.5px)}
.mask{position:absolute;overflow:hidden}
.plate{-webkit-mask-image:radial-gradient(ellipse 46% 50% at 50% 58%,#000 35%,rgba(0,0,0,.6) 55%,transparent 78%)}
.spot{position:absolute;left:-80px;top:520px;width:1240px;height:1000px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.07),transparent)}
.red{background:#e30613}
.hero{font-weight:800;line-height:.86;letter-spacing:-.02em;white-space:nowrap;-webkit-background-clip:text;background-clip:text;color:transparent}
.band{position:absolute;left:-100px;width:1280px;height:84px;background:#e30613;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.band div{position:absolute;top:0;left:0;height:84px;line-height:84px;white-space:nowrap;font-weight:800;font-size:40px;letter-spacing:.14em}
.vig{position:absolute;inset:0;z-index:18;background:radial-gradient(140% 90% at 50% 50%,transparent 65%,rgba(0,0,0,.28) 100%);pointer-events:none}
#grain{position:absolute;inset:0;z-index:19;mix-blend-mode:overlay;opacity:.05;width:1080px;height:1920px}
.fa{font-weight:700;font-size:104px;line-height:128px;white-space:nowrap;letter-spacing:-.01em;-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head>
<body><div id="stage">
 <div class="layer" id="main">
  <div class="beam" id="beam" style="display:none"></div>
  <img id="cbg" src="bg9x16.jpg" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
  <div class="carwrap" id="car">
    <div class="sweep"><i id="sw"></i></div>
    <div class="flare" id="fa" style="left:648px;top:240px"><b></b><s></s></div>
    <div class="flare" id="fb" style="left:985px;top:226px"><b></b><s></s></div>
  </div>

  <!-- S1: BLACK FRIDAY hook -->
  <div id="s1" class="abs" style="left:0;top:0;width:1080px;height:1920px;display:none">
    <div class="abs hero" id="h1" style="font-size:232px;left:0;right:0;top:600px;text-align:center">BLACK</div>
    <div class="abs red" id="h1bar" style="left:50%;top:818px;height:12px;width:0;transform:translateX(-50%)"></div>
    <div class="abs hero" id="h2" style="font-size:232px;left:0;right:0;top:858px;text-align:center">FRIDAY</div>
    <div class="abs" id="h3" style="left:0;right:0;top:1110px;text-align:center;font-weight:600;font-size:34px;letter-spacing:.5em;text-indent:.5em;color:#ddd">NISSAN&nbsp;QASHQAI</div>
  </div>

  <!-- persistent header -->
  <div id="hdr" class="abs" style="left:0;right:0;top:270px;height:110px;display:flex;justify-content:center;align-items:center;gap:30px">
    <div style="font-weight:600;font-size:44px">Fakto Auto</div>
    <div style="width:2px;height:74px;background:rgba(255,255,255,.7)"></div>
    <img src="logo_hd.png" style="height:88px">
  </div>

  <!-- S2: -20% -->
  <div id="s2" class="abs" style="left:0;top:0;width:1080px;height:1920px">
    <div class="mask" style="left:0;right:0;top:410px;height:300px">
      <div id="pc" class="abs" style="left:0;right:0;top:0;text-align:center;white-space:nowrap">
        <div style="font-weight:700;font-size:42px;letter-spacing:.42em;text-indent:.42em;line-height:56px;margin-bottom:6px">BLACK FRIDAY</div>
        <span class="red" id="slash" style="display:inline-block;width:14px;height:190px;transform:skewX(-16deg) translateY(16px);margin-right:30px;vertical-align:top"></span><span id="pct" class="hero" style="font-size:250px;font-style:italic;display:inline-block;transform:skewX(-6deg);padding:0 60px 0 20px;margin:0 -60px 0 -20px">-20%</span>
      </div>
    </div>
  </div>

  <!-- model name (S2+S3) -->
  <div class="mask" style="left:0;right:0;top:716px;height:130px">
    <div id="mdl" class="abs" style="left:0;right:0;top:0;text-align:center">
      <div style="font-weight:700;font-size:58px;line-height:1.1">Nissan Qashqai</div>
      <div style="font-weight:400;font-size:42px;line-height:1.25;color:#cfcfcf;letter-spacing:.06em">N-Design</div>
    </div>
  </div>

  <!-- S3: price -->
  <div id="s3" class="abs" style="left:0;top:0;width:1080px;height:1920px">
    <div class="abs" id="old" style="left:0;right:0;top:404px;text-align:center;font-weight:500;font-size:56px;color:#bdbdbd">
      <span style="position:relative;display:inline-block">38&nbsp;190&nbsp;€<span id="strike" class="abs" style="left:-6px;top:31px;height:4px;width:0;background:#e30613"></span></span></div>
    <div class="abs" id="new" style="left:0;right:0;top:470px;text-align:center;white-space:nowrap">
      <span style="font-weight:700;font-size:66px">Nuo </span><span id="num" class="hero" style="font-size:156px;font-weight:800">30&nbsp;070&nbsp;€</span></div>
    <div class="abs" id="pill" style="left:0;right:0;top:640px;text-align:center">
      <span style="display:inline-block;background:#e30613;padding:12px 30px;border-radius:6px;font-weight:700;font-size:36px;letter-spacing:.08em">SUTAUPYKITE 8&nbsp;120&nbsp;€</span></div>
  </div>

  <!-- marquee band -->
  <div class="band" id="band" style="top:1402px"><div id="bandt"></div></div>
  <div id="fine" class="abs" style="left:60px;right:60px;top:1548px;text-align:center;font-weight:400;font-size:22px;line-height:31px;color:rgba(255,255,255,.62)">Pasiūlymas galioja iki 2026 m. lapkričio 30 d. Pasiūlymo sąlygos – salone.<br>Nuotrauka iliustracinė.</div>
 </div>

 <!-- outro -->
 <div id="out" class="layer" style="opacity:0;background:#000">
  <div id="lock" class="abs" style="left:0;right:0;top:830px;height:260px;display:flex;justify-content:center;align-items:center">
    <div style="height:128px;overflow:hidden"><div id="ofa" class="fa">Fakto Auto</div></div>
    <div id="odiv" style="width:3px;height:0;background:rgba(255,255,255,.75);margin:0 44px"></div>
    <img id="ologo" src="logo_hd.png" style="height:132px">
  </div>
 </div>
 <div class="vig"></div>
 <canvas id="grain" width="540" height="960"></canvas>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,q5=x=>1-Math.pow(1-x,5);
const op=(id,v)=>$(id).style.opacity=v;
const unit='BLACK FRIDAY  •  -20 %  •  NISSAN QASHQAI  •  TIK IKI LAPKRIČIO 30 D.  •  ';
$('bandt').textContent=unit.repeat(5);const bu=document.createElement('span');bu.textContent=unit;bu.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:800 40px M;letter-spacing:.14em';document.body.appendChild(bu);
const gc=$('grain').getContext('2d');const grains=[];
for(let k=0;k<6;k++){const id=gc.createImageData(540,960);let seed=k*99991+7;
  for(let i=0;i<id.data.length;i+=4){seed=(seed*1103515245+12345)&0x7fffffff;const v=(seed>>8)&255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}grains.push(id)}
function cam(el,cx,cy,s,fx,fy){el.style.transform=`translate(${fx-cx*s}px,${fy-cy*s}px) scale(${s})`}
function glint(el,t,a,b,base='#f0f0f0'){const g=L(-30,130,eio(P(t,a,b)));el.style.backgroundImage=`linear-gradient(100deg,${base} ${g-12}%,#ffffff ${g}%,${base} ${g+12}%)`}
window.renderI=function(t,frame){
  // ---- car + parallax (whole main section 0..7.6)
  const e=eo(P(t,0,7.6));
  const carY=1150;
  const s=0.97;
  cam($('car'),561,330,s,540,1190);
  const lit=1;
  $('car').style.filter=$('cbg').style.filter=`brightness(${lit})`;
  $('beam').style.transform=`translateX(${L(-500,900,P(t,0,7.6))}px) rotate(28deg)`;
  $('sw').style.transform=`translateX(${L(-400,1500,eio(P(t,2.0,3.3)))}px) skewX(-22deg)`;
  if(t>5.9)$('sw').style.transform=`translateX(${L(-400,1500,eio(P(t,5.9,7.0)))}px) skewX(-22deg)`;
  const g=Math.max(Math.max(0,1-Math.abs(t-2.3)/.5)**1.5,Math.max(0,1-Math.abs(t-6.5)/.5)**1.5)*.8;
  ['fa','fb'].forEach((id,i)=>{op(id,g*(i?.8:1));$(id).style.transform=`scale(${(.5+g*1.3)/s})`});
  // ---- S1 hook
  const in1=q5(P(t,-0.18,0.4)), in2=q5(P(t,-0.08,0.5));
  const out1=eio(P(t,1.35,1.75));
  $('h1').style.transform=`translateX(${L(-1100,0,in1)}px) scale(${L(1,1.25,out1)})`;
  $('h2').style.transform=`translateX(${L(1100,0,in2)}px) scale(${L(1,1.25,out1)})`;
  glint($('h1'),t,0.6,1.3);glint($('h2'),t,0.7,1.4);
  $('h1bar').style.width=L(0,420,eio(P(t,0.45,0.9)))*(1-out1)+'px';
  op('h3',eo(P(t,0.7,1.1)));
  op('s1',1-out1);
  // ---- header
  op('hdr',eo(P(t,1.35,1.75))*(1-eio(P(t,7.25,7.6))));
  // ---- S2 -20%
  const VB=location.hash==='#B';
  const k2=VB?3.0:0;  // B: -20% block appears 3 s later
  const pin=q5(P(t,1.38+k2,1.9+k2));
  $('pc').style.transform=`translateY(${L(300,0,pin)}px)`;
  $('slash').style.height=L(0,190,eio(P(t,1.45+k2,1.8+k2)))+'px';
  glint($('pct'),t,2.4+k2,3.2+k2);
  const s2out=VB?0:eio(P(t,4.25,4.55));
  $('pc').style.opacity=1-s2out; if(t>4.25)$('pc').style.transform=`translateY(${L(0,-300,s2out)}px)`;
  // model name
  $('mdl').style.transform=`translateY(${L(140,0,q5(P(t,1.7,2.2)))}px)`;
  op('mdl',1-eio(P(t,7.25,7.6)));
  // ---- S3 price
  const k3=VB?-3.25:0;  // B: price block first
  op('old',eo(P(t,4.4+k3,4.75+k3)));$('old').style.transform=`translateY(${L(30,0,eo(P(t,4.4+k3,4.75+k3)))}px)`;
  $('strike').style.width=L(0,268,eio(P(t,4.85+k3,5.15+k3)))+'px';
  const np=VB?P(t,1.6,2.45):P(t,4.95,5.95);op('new',eo(P(t,4.9+k3,5.2+k3)));
  const v=Math.round(L(38190,30070,eio(np))/10)*10;
  $('num').textContent=String(v).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' €';
  glint($('num'),t,VB?3.0:6.3,VB?3.7:7.0);
  const ne=VB?2.45:5.95;$('new').style.transform=`scale(${np>=1?L(1.06,1,eo(P(t,ne,ne+.35))):1})`;
  const pp=VB?P(t,2.55,2.9):P(t,6.05,6.4);op('pill',pp>0?eo(pp):0);$('pill').style.transform=`scale(${L(.85,1,q5(pp))})`;
  const s3o=VB?eio(P(t,4.15,4.45)):eio(P(t,7.25,7.6));op('s3',1-s3o);$('s3').style.transform=VB?`translateY(${L(0,-120,s3o)}px)`:'';
  // ---- band
  const bi=q5(P(t,1.5,1.95));
  $('band').style.transform=`translateX(${L(-1300,0,bi)}px) rotate(-4deg)`;
  $('bandt').style.transform=`translateX(${-((t*150)%bu.getBoundingClientRect().width)}px)`;
  op('band',1-eio(P(t,7.25,7.6)));op('fine',eo(P(t,1.9,2.4))*(1-eio(P(t,7.25,7.6))));
  // ---- main fade, outro
  const mo=eio(P(t,7.25,7.65));$('main').style.opacity=1-mo;
  op('out',mo);
  const T0=7.45;
  $('lock').style.transform=`scale(${L(1,1.03,eo(P(t,T0+.15,10.5)))})`;
  $('ofa').style.transform=`translateY(${L(130,0,q5(P(t,T0+.15,T0+.65)))}px)`;
  glint($('ofa'),t,T0+1.0,T0+1.85,'#e6e6e6');
  $('odiv').style.height=L(0,120,eio(P(t,T0+.35,T0+.7)))+'px';
  const lp=eo(P(t,T0+.45,T0+.95));op('ologo',lp);$('ologo').style.transform=`translateX(${L(-30,0,lp)}px)`;
  $('stage').style.filter=`brightness(${1-eio(P(t,10.0,10.5))})`;
  gc.putImageData(grains[frame%6],0,0);
};
window.render=(t,f)=>renderI(t+1.5,f);
window.render(0,0);
</script></body></html>
