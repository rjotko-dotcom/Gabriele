<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(fonts/montl-400.woff2);font-weight:400}
@font-face{font-family:M;src:url(fonts/montl-500.woff2);font-weight:500}
@font-face{font-family:M;src:url(fonts/montl-600.woff2);font-weight:600}
@font-face{font-family:M;src:url(fonts/montl-700.woff2);font-weight:700}
@font-face{font-family:M;src:url(fonts/montl-800.woff2);font-weight:800}
@font-face{font-family:M;src:url(fonts/mont-400.woff2);font-weight:400;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-500.woff2);font-weight:500;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-600.woff2);font-weight:600;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-700.woff2);font-weight:700;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-800.woff2);font-weight:800;unicode-range:U+0100-024F}
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}
*{box-sizing:border-box}
#stage{position:absolute;inset:0;overflow:hidden;font-family:M,sans-serif;color:#fff;background:#000}
.abs{position:absolute}.layer{position:absolute;inset:0;overflow:hidden}
.mask{position:absolute;overflow:hidden}
.word{position:absolute;left:84px;font-weight:800;font-size:250px;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.kick{position:absolute;left:92px;font-weight:600;font-size:34px;letter-spacing:.32em}
.red{background:#e30613}
.co{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.lbl{position:absolute;font-weight:600;font-size:30px;letter-spacing:.04em;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.lbl small{display:block;font-weight:400;font-size:22px;letter-spacing:.18em;color:#d0d0d0;margin-top:4px}
.sweep{position:absolute;inset:0;-webkit-mask-image:url(lumcar.png);-webkit-mask-size:100% 100%}
.sweep i{position:absolute;top:-50%;height:200%;width:260px;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-22deg)}
.carwrap{position:absolute;left:0;top:0;width:1122px;height:590px;transform-origin:0 0}
.fa{font-weight:700;font-size:104px;line-height:128px;white-space:nowrap;letter-spacing:-.01em;-webkit-background-clip:text;background-clip:text;color:transparent}
.strike{position:relative;display:inline-block}
#grain{position:absolute;inset:0;z-index:19;mix-blend-mode:overlay;opacity:.05;width:1080px;height:1920px;pointer-events:none}
</style></head>
<body><div id="stage">
 <!-- 1: JUODA / BALTA / TAVO -->
 <div class="layer" id="k1" style="background:#000"><div class="kick" style="top:640px;color:#888">NISSAN QASHQAI N-DESIGN</div>
   <div class="mask" style="left:0;right:0;top:700px;height:270px"><div class="word" id="w1" style="top:0;color:#fff">JUODA.</div></div></div>
 <div class="layer" id="k2" style="background:#f4f4f4"><div class="kick" style="top:640px;color:#777">NISSAN QASHQAI N-DESIGN</div>
   <div class="mask" style="left:0;right:0;top:700px;height:270px"><div class="word" id="w2" style="top:0;color:#000">BALTA.</div></div></div>
 <div class="layer" id="k3" style="background:#e30613"><div class="kick" style="top:640px;color:rgba(255,255,255,.75)">BLACK FRIDAY</div>
   <div class="mask" style="left:0;right:0;top:700px;height:270px"><div class="word" id="w3" style="top:0;color:#fff">TAVO.</div></div></div>

 <!-- 2/3: car scene -->
 <div class="layer" id="car" style="opacity:0">
   <div class="layer" id="cam">
     <img src="bg9x16.jpg" style="position:absolute;left:0;top:0;width:1080px;height:1920px" id="bgimg">
     <div class="carwrap" id="cw"><div class="sweep"><i id="sw"></i></div></div>
     <svg class="co" id="lines" viewBox="0 0 1080 1920"></svg>
     <div id="labels"></div>
   </div>
   <div class="layer" id="shade" style="background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,.15) 40%,transparent 55%);opacity:0"></div>
   <!-- titles over car -->
   <div id="t1" class="abs" style="left:0;right:0;top:330px;text-align:center">
     <div style="font-weight:600;font-size:34px;letter-spacing:.32em;text-indent:.32em;color:#cfcfcf">NISSAN</div>
     <div style="font-weight:800;font-size:118px;line-height:1.02;letter-spacing:-.02em">Qashqai</div>
     <div style="font-weight:400;font-size:44px;letter-spacing:.18em;text-indent:.18em;color:#e6e6e6">N-DESIGN</div>
   </div>
   <!-- deal -->
   <div id="deal" class="abs" style="left:0;right:0;top:300px;text-align:center">
     <div id="d1" style="font-weight:700;font-size:40px;letter-spacing:.42em;text-indent:.42em">BLACK FRIDAY</div>
     <div id="d2" style="margin-top:34px;font-weight:600;font-size:34px;letter-spacing:.3em;text-indent:.3em;color:#d6d6d6">SUTAUPYKITE</div>
     <div id="d3" style="font-weight:800;font-size:190px;line-height:1;letter-spacing:-.03em;color:#ff1f2b;white-space:nowrap"><span id="save">8&nbsp;120</span>&nbsp;€</div>
     <div id="d4" style="margin-top:22px;white-space:nowrap"><span class="strike" style="font-weight:500;font-size:46px;color:#bdbdbd;margin-right:26px">38&nbsp;190&nbsp;€<span id="strk" class="abs" style="left:-6px;top:26px;height:4px;width:0;background:#e30613"></span></span><span style="font-weight:700;font-size:50px">Nuo </span><span style="font-weight:800;font-size:96px">30&nbsp;070&nbsp;€</span></div>
     <div id="d5" style="margin-top:26px"><span style="display:inline-block;border:2px solid rgba(255,255,255,.85);padding:12px 30px;font-weight:600;font-size:30px;letter-spacing:.16em">TIK IKI LAPKRIČIO 30 D.</span></div>
   </div>
   <div id="fine" class="abs" style="left:60px;right:60px;top:1548px;text-align:center;font-weight:400;font-size:22px;line-height:31px;color:rgba(255,255,255,.62)">Pasiūlymas galioja iki 2026 m. lapkričio 30 d. Pasiūlymo sąlygos – salone.<br>Nuotrauka iliustracinė.</div>
   <div class="layer" id="wipe" style="background:#e30613"></div>
 </div>

 <!-- outro -->
 <div id="out" class="layer" style="opacity:0;background:#000">
  <div id="lock" class="abs" style="left:0;right:0;top:830px;height:260px;display:flex;justify-content:center;align-items:center">
    <div style="height:128px;overflow:hidden"><div id="ofa" class="fa">Fakto Auto</div></div>
    <div id="odiv" style="width:3px;height:0;background:rgba(255,255,255,.75);margin:0 44px"></div>
    <img id="ologo" src="logo_hd.png" style="height:132px">
  </div>
 </div>
 <canvas id="grain" width="540" height="960"></canvas>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,q5=x=>1-Math.pow(1-x,5);
const op=(id,v)=>$(id).style.opacity=v;
// car strip -> screen mapping (background built at s=.97, strip x 561 -> 540, strip y 330 -> 1190)
const S=.97, sx=x=>(x-561)*S+540, sy=y=>(y-330)*S+1190;
$('cw').style.transform=`translate(${540-561*S}px,${1190-330*S}px) scale(${S})`;
// callouts: anchor (strip coords) -> elbow -> label end
const CO=[
 {a:[430,22], e:[300,780], end:[110,780], side:'l', t:'Juodas kontrastinis stogas', s:'N-DESIGN', at:3.75},
 {a:[648,240],e:[700,960], end:[990,960], side:'r', t:'LED žibintai', s:'IŠRAIŠKINGAS VEIDAS', at:4.35},
 {a:[495,395],e:[330,1420],end:[110,1420],side:'l', below:true, t:'Juodi ratlankiai', s:'SPORTIŠKAS AKCENTAS', at:4.95},
];
let svg='',lab='';
CO.forEach((c,i)=>{
  const ax=sx(c.a[0]), ay=sy(c.a[1]);
  svg+=`<circle id="cd${i}" cx="${ax}" cy="${ay}" r="9" fill="#fff"/><circle id="cr${i}" cx="${ax}" cy="${ay}" r="9" fill="none" stroke="#fff" stroke-width="2"/>
        <polyline id="cl${i}" points="${ax},${ay} ${c.e[0]},${c.e[1]} ${c.end[0]},${c.end[1]}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
  const ty=c.below?c.end[1]+16:c.end[1]-88;const st=c.side==='l'?`left:${c.end[0]}px;top:${ty}px`:`right:${1080-c.end[0]}px;top:${ty}px;text-align:right`;
  lab+=`<div class="lbl" id="lb${i}" style="${st}">${c.t}<small>${c.s}</small></div>`;
});
$('lines').innerHTML=svg;$('labels').innerHTML=lab;
CO.forEach((c,i)=>{const pl=$('cl'+i);const len=pl.getTotalLength();pl.style.strokeDasharray=len;pl.dataset.len=len});
const gc=$('grain').getContext('2d');const grains=[];
for(let k=0;k<6;k++){const id=gc.createImageData(540,960);let seed=k*99991+7;
  for(let i=0;i<id.data.length;i+=4){seed=(seed*1103515245+12345)&0x7fffffff;const v=(seed>>8)&255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}grains.push(id)}
function glint(el,t,a,b,base){const g=L(-30,130,eio(P(t,a,b)));el.style.backgroundImage=`linear-gradient(100deg,${base} ${g-12}%,#ffffff ${g}%,${base} ${g+12}%)`}
const fmt=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
window.render=function(t,frame){
  // ---- 1: kinetic words (hard cuts on the beat)
  op('k1',t<1.0?1:0); op('k2',t>=1.0&&t<2.0?1:0); op('k3',t>=2.0&&t<3.2?1:0);
  [['w1',0],['w2',1.0],['w3',2.0]].forEach(([id,a])=>{$(id).style.transform=`translateY(${L(270,0,q5(P(t,a+.02,a+.38)))}px)`});
  // ---- 2: red splits open to reveal the car
  const on=t>=3.0; op('car',on?1:0);
  const wp=eio(P(t,3.0,3.55));
  $('wipe').style.clipPath=`inset(0 0 0 0)`; $('wipe').style.transform=`translateY(${L(0,-1920,wp)}px)`;
  op('wipe',t<3.55?1:0);
  const z=L(1.08,1.0,eo(P(t,3.0,4.2)))+L(0,.025,P(t,4.2,9.6));
  $('cam').style.transform=`scale(${z})`;$('cam').style.transformOrigin='50% 60%';
  $('sw').style.transform=`translateX(${L(-400,1500,eio(P(t,3.3,4.6)))}px) skewX(-22deg)`;
  if(t>8.2)$('sw').style.transform=`translateX(${L(-400,1500,eio(P(t,8.2,9.2)))}px) skewX(-22deg)`;
  // title
  const ti=q5(P(t,3.35,3.85)), to=eio(P(t,6.5,6.85));
  op('t1',ti*(1-to)); $('t1').style.transform=`translateY(${L(40,0,ti)-L(0,60,to)}px)`;
  // callouts
  const coOut=eio(P(t,6.4,6.8));
  CO.forEach((c,i)=>{
    const dp=eo(P(t,c.at,c.at+.2)), lp=eio(P(t,c.at+.1,c.at+.55)), tp=eo(P(t,c.at+.45,c.at+.8));
    const ring=P(t,c.at,c.at+.7);
    $('cd'+i).setAttribute('r',9*dp); $('cr'+i).setAttribute('r',9+28*ring); $('cr'+i).style.opacity=(1-ring)*dp;
    const pl=$('cl'+i),len=+pl.dataset.len; pl.style.strokeDashoffset=len*(1-lp);
    op('lb'+i,tp*(1-coOut)); $('lb'+i).style.transform=`translateY(${L(16,0,tp)}px)`;
    $('cd'+i).style.opacity=1-coOut; pl.style.opacity=1-coOut;
  });
  // ---- 3: deal
  op('shade',eio(P(t,6.6,7.0)));
  const d=(a,b,id,dy=30)=>{const p=q5(P(t,a,b));op(id,p);$(id).style.transform=`translateY(${L(dy,0,p)}px)`};
  d(6.75,7.15,'d1'); d(6.95,7.35,'d2');
  const sp=P(t,7.1,8.0); op('d3',eo(P(t,7.1,7.3))); $('d3').style.transform=`scale(${sp>=1?L(1.08,1,eo(P(t,8.0,8.35))):L(.9,1,eo(sp))})`;
  $('save').textContent=fmt(Math.round(L(0,8120,eio(sp))/10)*10);
  d(8.1,8.5,'d4'); $('strk').style.width=L(0,232,eio(P(t,8.35,8.7)))+'px';
  d(8.55,8.95,'d5'); op('fine',eo(P(t,8.6,9.0))*(1-eio(P(t,9.55,9.9))));
  op('deal',t<6.7?0:1-eio(P(t,9.55,9.9)));
  // ---- 4: outro (same as the other ads)
  const mo=eio(P(t,9.55,9.95)); if(t>=9.55){op('car',1-mo)}
  op('out',mo);
  const T0=9.75;
  $('lock').style.transform=`scale(${L(1,1.03,eo(P(t,T0+.15,12.6)))})`;
  $('ofa').style.transform=`translateY(${L(130,0,q5(P(t,T0+.15,T0+.65)))}px)`;
  glint($('ofa'),t,T0+1.0,T0+1.85,'#e6e6e6');
  $('odiv').style.height=L(0,120,eio(P(t,T0+.35,T0+.7)))+'px';
  const lp=eo(P(t,T0+.45,T0+.95));op('ologo',lp);$('ologo').style.transform=`translateX(${L(-30,0,lp)}px)`;
  $('stage').style.filter=`brightness(${1-eio(P(t,12.2,12.7))})`;
  gc.putImageData(grains[frame%6],0,0);
};
window.render(0,0);
</script></body></html>
