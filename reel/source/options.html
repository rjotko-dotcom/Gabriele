<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(fonts/montl-400.woff2);font-weight:400}
@font-face{font-family:M;src:url(fonts/montl-500.woff2);font-weight:500}
@font-face{font-family:M;src:url(fonts/montl-600.woff2);font-weight:600}
@font-face{font-family:M;src:url(fonts/montl-700.woff2);font-weight:700}
@font-face{font-family:M;src:url(fonts/montl-800.woff2);font-weight:800}
@font-face{font-family:M;src:url(fonts/mont-500.woff2);font-weight:500;unicode-range:U+0100-024F}
@font-face{font-family:M;src:url(fonts/mont-700.woff2);font-weight:700;unicode-range:U+0100-024F}
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}
*{box-sizing:border-box}
#stage{position:absolute;inset:0;overflow:hidden;font-family:M,sans-serif;color:#fff;background:#000}
.abs{position:absolute}
.c{left:0;right:0;text-align:center}
.carwrap{position:absolute;left:0;top:0;width:1122px;height:590px;transform-origin:0 0}
.carwrap img{position:absolute;left:0;top:0;width:1122px;height:590px}
/* studio plate melts into pure black: no rectangle edges */
.plate{-webkit-mask-image:radial-gradient(ellipse 46% 50% at 50% 58%,#000 35%,rgba(0,0,0,.6) 55%,transparent 78%)}
.spot{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.07),transparent);pointer-events:none}
.red{background:#e30613}
.hdr{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:30px}
.hdr div{font-weight:600;font-size:44px}
.strike{position:relative;display:inline-block;color:#a9a9a9}
.strike:after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:4px;background:#e30613}
.vig{position:absolute;inset:0;background:radial-gradient(130% 85% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
.tag{position:absolute;top:24px;left:24px;font:600 22px M;letter-spacing:.2em;color:#666}
</style></head>
<body><div id="stage"></div>
<script>
const v=(location.hash||'#A').slice(1);
const HDR=top=>`<div class="hdr" style="top:${top}px;height:100px"><div>Fakto Auto</div><div style="width:2px;height:70px;background:rgba(255,255,255,.7)"></div><img src="logo_hd.png" style="height:84px"></div>`;
function car(fy,s,fx=540){
  const tx=fx-566*s, ty=fy-330*s, T=`translate(${tx}px,${ty}px) scale(${s})`;
  return `<div class="spot" style="left:${fx-620}px;top:${fy-520}px;width:1240px;height:900px"></div>
  <div class="carwrap plate" style="transform:${T}"><img src="bgplate.png"></div>
  <div class="carwrap" style="transform:${T}"><img src="carcut.png"></div>`;
}
const PRICE_OLD='38&nbsp;190&nbsp;€', PRICE='30&nbsp;070&nbsp;€', SAVE='8&nbsp;120&nbsp;€';
const V={
// A: clean centred stack, price is the hero
A:()=>`${HDR(270)}
 <div class="abs c" style="top:425px;font-weight:800;font-size:112px;letter-spacing:-.01em;line-height:1">BLACK FRIDAY</div>
 <div class="abs c" style="top:568px;font-weight:700;font-size:50px">Nissan Qashqai <span style="font-weight:400;color:#cfcfcf">N-Design</span></div>
 ${car(1000,.95)}
 <div class="abs c" style="top:1250px;font-weight:500;font-size:52px"><span class="strike">${PRICE_OLD}</span></div>
 <div class="abs c" style="top:1310px;white-space:nowrap"><span style="font-weight:700;font-size:64px">Nuo </span><span style="font-weight:800;font-size:150px">${PRICE}</span></div>
 <div class="abs c" style="top:1490px"><span class="red" style="display:inline-block;padding:12px 28px;border-radius:6px;font-weight:700;font-size:34px;letter-spacing:.08em">-20 % &nbsp;·&nbsp; SUTAUPYKITE ${SAVE}</span></div>`,
// B: giant -20% hero, straight red label, price under the car
B:()=>`${HDR(270)}
 <div class="abs" style="left:70px;top:380px;display:flex;align-items:center;gap:34px">
   <span class="red" style="display:block;width:16px;height:230px;transform:skewX(-16deg)"></span>
   <span style="font-weight:800;font-style:italic;font-size:280px;line-height:1;letter-spacing:-.03em;transform:skewX(-6deg);display:block">-20%</span>
 </div>
 <div class="abs" style="left:100px;top:660px;font-weight:700;font-size:52px;letter-spacing:.32em">BLACK FRIDAY</div>
 ${car(1030,.95)}
 <div class="abs red" style="left:0;right:0;top:1290px;height:78px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:38px;letter-spacing:.2em">NISSAN QASHQAI N-DESIGN</div>
 <div class="abs c" style="top:1400px;white-space:nowrap"><span style="font-weight:500;font-size:48px;margin-right:30px"><span class="strike">${PRICE_OLD}</span></span><span style="font-weight:700;font-size:56px">Nuo </span><span style="font-weight:800;font-size:116px">${PRICE}</span></div>`,
// C: big car, glass price card at the bottom
C:()=>`${HDR(270)}
 <div class="abs c" style="top:420px;font-weight:700;font-size:64px;letter-spacing:.42em;text-indent:.42em">BLACK FRIDAY</div>
 <div class="abs red" style="left:500px;top:524px;width:80px;height:6px"></div>
 ${car(860,1.0)}
 <div class="abs" style="left:70px;right:70px;top:1150px;height:400px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(14px)">
   <div class="abs" style="left:44px;top:40px;font-weight:700;font-size:50px">Nissan Qashqai</div>
   <div class="abs" style="left:44px;top:102px;font-weight:400;font-size:38px;color:#cfcfcf">N-Design</div>
   <div class="abs red" style="right:44px;top:44px;padding:14px 22px;border-radius:8px;font-weight:800;font-style:italic;font-size:56px;line-height:1">-20%</div>
   <div class="abs" style="left:44px;right:44px;top:178px;height:1.5px;background:rgba(255,255,255,.15)"></div>
   <div class="abs" style="left:44px;top:206px;font-weight:500;font-size:44px"><span class="strike">${PRICE_OLD}</span></div>
   <div class="abs" style="left:44px;top:258px;white-space:nowrap"><span style="font-weight:700;font-size:52px">Nuo </span><span style="font-weight:800;font-size:110px;line-height:1">${PRICE}</span></div>
   <div class="abs" style="right:44px;top:214px;font-weight:600;font-size:28px;letter-spacing:.1em;color:#ff4d55;text-align:right">SUTAUPYKITE<br><span style="font-size:40px;color:#fff;letter-spacing:0">${SAVE}</span></div>
 </div>`,
// D: minimal premium, outline BLACK FRIDAY behind the car
D:()=>`${HDR(270)}
 <div class="abs c" style="top:400px;font-weight:800;font-size:206px;line-height:.92;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.55)">BLACK<br>FRIDAY</div>
 ${car(1075,.97)}
 <div class="abs c" style="top:1285px;font-weight:700;font-size:48px">Nissan Qashqai <span style="font-weight:400;color:#cfcfcf">N-Design</span></div>
 <div class="abs c" style="top:1350px;white-space:nowrap"><span style="font-weight:700;font-size:60px">Nuo </span><span style="font-weight:800;font-size:140px">${PRICE}</span></div>
 <div class="abs c" style="top:1515px;font-weight:500;font-size:42px"><span class="strike">${PRICE_OLD}</span><span style="margin-left:34px;color:#ff2b35;font-weight:800;font-style:italic">-20%</span></div>`
};
document.getElementById('stage').innerHTML=V[v]()+'<div class="vig"></div>';
window.render=()=>{};
</script></body></html>
